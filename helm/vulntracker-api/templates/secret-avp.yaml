{{- if eq .Values.secrets.provider "avp" }}
# Resolved by the Argo CD Vault Plugin at manifest-generation time, using AVP's
# inline path syntax: <path:KV-PATH#KEY>. The Argo CD Application must be
# rendered through the avp plugin (e.g. plugin name argocd-vault-plugin-helm).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulntracker-api.secretName" . }}
  labels: {{- include "vulntracker-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.secrets.items }}
  {{ .envVar }}: {{ .path | default (printf "<path:%s#%s>" $.Values.secrets.avp.path (.key | default .envVar)) | quote }}
  {{- end }}
{{- end }}
