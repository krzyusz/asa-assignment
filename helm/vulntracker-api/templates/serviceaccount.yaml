{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker-api.serviceAccountName" . }}
  labels: {{- include "vulntracker-api.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# The API never calls the Kubernetes API — don't mount a token.
automountServiceAccountToken: false
{{- end }}
