{{- if eq .Values.secrets.provider "eso" }}
# External Secrets Operator syncs the backend values into the Secret consumed
# by the Deployment. Requires ESO installed and the referenced (Cluster)SecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "vulntracker-api.fullname" . }}
  labels: {{- include "vulntracker-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.secrets.eso.secretStoreRef.name }}
    kind: {{ .Values.secrets.eso.secretStoreRef.kind }}
  target:
    name: {{ include "vulntracker-api.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels: {{- include "vulntracker-api.labels" . | nindent 10 }}
  data:
    {{- range .Values.secrets.items }}
    - secretKey: {{ .envVar }}
      remoteRef:
        key: {{ .remoteKey | default $.Values.secrets.eso.remoteKey }}
        property: {{ .key | default .envVar }}
    {{- end }}
{{- end }}
